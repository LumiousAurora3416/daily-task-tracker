<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7C3AED">
<title>学习目标工作台</title>
<style>
/* ============ 块2占位（CSS由后续块追加） ============ */

/* ========== 基础与色彩系统 ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F9FAFC;                  /* 冷白色背景 */
  --bg-card:#FFFFFF;
  --text:#1F2937;
  --text-sec:#6B7280;
  --border:#E5E7EB;
  --primary:#7C3AED;             /* 紫色主色 */
  --primary-2:#A855F7;
  --primary-bg:#F5F3FF;
  --success:#10B981;             /* 成功绿 */
  --success-bg:#ECFDF5;
  --danger:#EF4444;              /* 逾期红 */
  --danger-bg:#FEF2F2;
  --warn:#F59E0B;                /* 休息日琥珀 */
  --warn-bg:#FFFBEB;
  --makeup:#8B5CF6;              /* 补记紫 */
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(124,58,237,.06);
  --shadow-lg:0 10px 30px rgba(124,58,237,.12);
  --grad:linear-gradient(135deg,#7C3AED 0%,#A855F7 100%);
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:0;padding-bottom:64px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
svg{display:block;flex-shrink:0}

/* ========== 布局：手机默认（底部Tab + 单列） ========== */
.app{display:flex;flex-direction:column;min-height:100vh;max-width:100%}
.sidebar{display:none}
.topbar{display:none}
.banner{
  background:linear-gradient(90deg,#FEF3C7,#FDE68A);
  color:#92400E;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  font-size:13px;position:sticky;top:0;z-index:50;
}
.banner button{background:#fff;border:1px solid #F59E0B;color:#92400E;padding:4px 10px;border-radius:6px;font-size:12px}
.main{flex:1;padding:12px 14px 24px;overflow-x:hidden}
.content{max-width:100%}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.page-title{font-size:18px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* 底部Tab */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);z-index:100;padding:6px 0 calc(6px + env(safe-area-inset-bottom));
}
.tabbar .tab-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--text-sec);font-size:11px}
.tabbar .tab-btn.active{color:var(--primary)}
.tabbar .tab-btn svg{width:22px;height:22px}

/* 平板：顶部Tab + 稍宽留白 */
@media(min-width:768px){
  body{padding-bottom:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .top-tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
  .top-tabs .tab-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;color:var(--text-sec);font-size:13px;font-weight:500}
  .top-tabs .tab-btn.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
  .top-tabs .tab-btn svg{width:18px;height:18px}
  .tabbar{display:none}
  .main{padding:24px 28px 48px}
  .content{max-width:960px;margin:0 auto}
}

/* 电脑：左侧边栏 + 多栏 */
@media(min-width:1200px){
  .app{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .banner{width:100%}
  .sidebar{
    display:flex;flex-direction:column;gap:18px;width:240px;flex-shrink:0;
    padding:24px 18px;border-right:1px solid var(--border);background:#fff;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:4px 8px}
  .side-nav{display:flex;flex-direction:column;gap:4px}
  .side-nav .tab-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-sec);font-size:14px;font-weight:500;text-align:left}
  .side-nav .tab-btn:hover{background:var(--primary-bg)}
  .side-nav .tab-btn.active{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
  .side-nav .tab-btn svg{width:18px;height:18px}
  .side-footer{margin-top:auto;font-size:12px;color:var(--text-sec);padding:8px}
  .topbar{display:none}
  .main{flex:1;min-width:0;padding:28px 40px 80px 40px}
  .content{max-width:1100px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
}

/* ========== 通用组件 ========== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s;
  white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #FECACA}
.btn-success{background:var(--success-bg);color:var(--success);border:1px solid #A7F3D0}
.btn-ghost{color:var(--text-sec)}
.btn-ghost:hover{background:var(--bg)}
.btn-lg{padding:14px 20px;font-size:15px;border-radius:12px}
.btn-block{width:100%}

.card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:1px solid var(--border)}
.card + .card{margin-top:12px}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-sub{font-size:12px;color:var(--text-sec);margin-top:2px}
.card-dot{width:10px;height:10px;border-radius:50%}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--text)}
.field input,.field textarea,.field select{
  border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:#fff;
  outline:none;transition:.15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.field textarea{min-height:70px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--text-sec)}
.schedule-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.schedule-mode{position:relative;cursor:pointer}
.schedule-mode input{position:absolute;opacity:0;pointer-events:none}
.schedule-mode span{
  display:flex;align-items:center;justify-content:center;min-height:38px;padding:8px 10px;
  border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text-sec);
  font-size:13px;font-weight:600;transition:.15s;
}
.schedule-mode input:checked + span{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.weekday-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.weekday-option{position:relative;cursor:pointer}
.weekday-option input{position:absolute;opacity:0;pointer-events:none}
.weekday-option span{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:50%;background:#fff;color:var(--text-sec);
  font-size:12px;font-weight:700;transition:.15s;
}
.weekday-option input:checked + span{border-color:var(--primary);background:var(--primary);color:#fff}

/* ========== 徽章 / 状态标识 ========== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.4}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-warn{background:var(--warn-bg);color:#B45309}
.badge-makeup{background:#EDE9FE;color:var(--makeup)}
.badge-idle{background:#F3F4F6;color:#6B7280}
.badge-primary{background:var(--primary-bg);color:var(--primary)}

/* 目标卡片状态边色 */
.goal-card{border-left:4px solid var(--primary);position:relative}
.goal-card.rest-card{border-left-color:var(--warn)}
.goal-card.miss-card{border-left-color:var(--danger)}
.goal-card.overdue-card{border-left-color:var(--danger);background:linear-gradient(90deg,#FEF2F2 0%,#fff 30%)}
.goal-card.yesterday-miss{background:linear-gradient(90deg,#FEF2F2 0%,#fff 18%)}

/* ========== 进度环 ========== */
.ring-row{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.ring{position:relative;width:80px;height:80px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ring-bg{stroke:#F3F4F6;fill:none;stroke-width:8}
.ring .ring-fg{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.ring-stat-box{flex:1;min-width:0}
.ring-triplet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.ring-triplet .n{font-size:18px;font-weight:800}
.ring-triplet .l{font-size:11px;color:var(--text-sec)}

/* ========== 目标卡（今日Tab） ========== */
.goal-name{font-size:16px;font-weight:700}
.goal-progress{height:6px;background:#F3F4F6;border-radius:99px;margin:10px 0 6px;overflow:hidden}
.goal-progress > div{height:100%;border-radius:99px;transition:width .4s}
.goal-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--text-sec);margin-bottom:8px}
.plan-box{
  background:var(--warn-bg);border:1px dashed #FCD34D;border-radius:10px;
  padding:10px 12px;margin:10px 0 12px;font-size:12.5px;line-height:1.7;
}
.plan-box strong{color:#B45309;margin-right:4px}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.amount-input{
  display:inline-flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;
}
.amount-input input{border:none;outline:none;width:80px;padding:8px 10px;text-align:center;font-weight:700;font-size:15px}
.amount-input .unit{padding:0 10px;color:var(--text-sec);font-size:12px;border-left:1px solid var(--border)}
.minute-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:#F3F4F6;color:var(--text-sec);border-radius:8px;font-size:12px}
.minute-chip svg{width:14px;height:14px;flex-shrink:0}
.minute-chip input{width:44px;border:none;outline:none;background:transparent;font-weight:600;text-align:center;color:var(--text)}
.action-icons{display:flex;gap:2px;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-sec)}
.icon-btn:hover{background:var(--bg);color:var(--primary)}
.icon-btn.danger:hover{background:var(--danger-bg);color:var(--danger)}
.icon-btn svg{width:16px;height:16px}

.overdue-footer{
  margin-top:10px;padding-top:10px;border-top:1px dashed #FECACA;
  display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:#B91C1C;
}

/* ========== 看板 Tab ========== */
.kanban-card .records-list{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.rec-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 4px;border-radius:8px;font-size:13px;
}
.rec-item:hover{background:var(--bg)}
.rec-left{display:flex;align-items:center;gap:8px;min-width:0}
.rec-date{color:var(--text-sec);font-size:12px;flex-shrink:0}
.rec-amount{font-weight:700}
.rec-min{font-size:11px;color:var(--text-sec)}

/* SVG柱状图容器 */
.chart-wrap{margin-top:12px;padding:10px;background:var(--bg);border-radius:10px}
.chart-title{font-size:12px;font-weight:600;color:var(--text-sec);margin-bottom:8px}

/* ========== 周报 Tab ========== */
.week-switch{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.week-title{font-size:16px;font-weight:700}
.compare-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.stat-card .label{font-size:12px;color:var(--text-sec);margin-bottom:6px}
.stat-card .value{font-size:22px;font-weight:800}
.stat-card .delta{font-size:12px;margin-top:4px;font-weight:600}
.delta-up{color:var(--success)}
.delta-down{color:var(--danger)}
.delta-flat{color:var(--text-sec)}

.goal-week-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin:8px 0 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.goal-week-table th,.goal-week-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.goal-week-table th{background:var(--primary-bg);color:var(--primary);font-size:12px;font-weight:700}
.goal-week-table tr:last-child td{border-bottom:none}

.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media(max-width:767px){.notes-grid{grid-template-columns:1fr}}
.notes-grid textarea{min-height:96px;border:1px solid var(--border);border-radius:10px;padding:10px;outline:none;resize:vertical}
.notes-grid textarea:focus{border-color:var(--primary)}
.notes-grid .note-label{font-size:12px;font-weight:700;color:var(--text);margin-bottom:5px;display:flex;align-items:center;gap:5px}

.report-box{background:#1F2937;color:#F9FAFB;padding:14px;border-radius:12px;margin-top:14px;font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}

/* ========== 我的 Tab ========== */
.section-title{font-size:14px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.section-title svg{width:18px;height:18px;flex-shrink:0}
.data-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.data-info{flex:1;min-width:0}
.data-info .t{font-weight:700;font-size:14px;margin-bottom:3px}
.data-info .d{font-size:12px;color:var(--text-sec)}
.homescreen-steps{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.hs-step{display:flex;gap:12px;align-items:flex-start}
.hs-step-num{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;box-shadow:var(--shadow)}
.hs-step-body{flex:1}
.hs-step-body h4{font-size:14px;font-weight:700;margin-bottom:4px}
.hs-step-body p{font-size:12.5px;color:var(--text-sec);line-height:1.7}

/* ========== 模态层 ========== */
.modal-mask{
  position:fixed;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:999;
  padding:16px;animation:fadein .2s;
}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:86vh;overflow:auto;
  box-shadow:var(--shadow-lg);animation:popin .2s;
}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:16px;font-weight:700}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{transform:translateY(12px) scale(.97);opacity:0}to{transform:none;opacity:1}}

/* ========== Toast ========== */
.toast-wrap{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1F2937;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);animation:toastin .25s}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@keyframes toastin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

/* ========== 彩带 ========== */
.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9998}
.confetti{position:absolute;width:8px;height:12px;top:-10%;animation:fall 2.6s linear forwards;transform:rotate(45deg)}
@keyframes fall{
  0%{transform:translateY(0) rotate(0)}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

/* ========== 空态 ========== */
.empty{padding:50px 20px;text-align:center;color:var(--text-sec)}
.empty svg{width:64px;height:64px;margin:0 auto 12px;opacity:.5}
.empty h4{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--text)}
.empty p{font-size:13px}

/* ========== 顶部大按钮 & 底部再入口 ========== */
.hero-create{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--grad);color:#fff;border-radius:14px;padding:16px;font-weight:700;font-size:15px;
  box-shadow:var(--shadow-lg);margin-bottom:14px;
}
.hero-create svg{width:20px;height:20px}
.bottom-create{
  margin-top:24px;padding:14px;background:var(--primary-bg);border-radius:14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px dashed #C4B5FD;
}
.bottom-create p{font-size:13px;color:var(--primary);font-weight:500}

/* ========== 番茄钟浮动条 ========== */
.pomo-bar{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.15);
  display:none;align-items:center;gap:12px;padding:10px 16px;z-index:200;
  min-width:320px;max-width:90vw;
}
@media(min-width:768px){.pomo-bar{bottom:24px}}
.pomo-info{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;white-space:nowrap}
.pomo-time{
  color:#fff;padding:3px 10px;border-radius:8px;font-family:Menlo,monospace;font-size:15px;font-weight:800;
}
.pomo-progress{flex:1;height:6px;background:#F3F4F6;border-radius:99px;overflow:hidden;min-width:80px}
.pomo-progress > div{height:100%;border-radius:99px;transition:width .3s}
.pomo-actions{display:flex;gap:6px;flex-shrink:0}
/* 番茄钟设置区（在今日Tab顶部） */
.pomo-setup{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--primary-bg);border-radius:12px;margin-bottom:12px;
}
.pomo-setup label{font-size:13px;font-weight:600;color:var(--primary)}
.pomo-setup input[type=number]{
  width:60px;padding:5px 8px;border:1px solid #C4B5FD;border-radius:8px;text-align:center;font-weight:700;
}
.pomo-setup .hint{color:var(--primary);opacity:.7}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 备份横幅（JS动态显示） -->
  <div id="backupBanner" class="banner" style="display:none">
    <span id="bannerText">💡 您已累积 20 条打卡记录，建议导出备份以防数据丢失</span>
    <button id="bannerExportBtn">立即导出</button>
  </div>

  <!-- 电脑：左侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      学习工作台
    </div>

/* ========== 工具函数 ========== */
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function pad(n){ return n<10?('0'+n):(''+n); }
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDaysStr(s, n){
  const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
}
function diffDays(a, b){  // a - b (YYYY-MM-DD)
  const [ya,ma,da]=a.split('-').map(Number);
  const [yb,mb,db]=b.split('-').map(Number);
  return Math.round((new Date(ya,ma-1,da) - new Date(yb,mb-1,db))/86400000);
}
function isoWeekday(s){ const [y,m,d]=s.split('-').map(Number); return (new Date(y,m-1,d).getDay()+6)%7 + 1; } // 1=Mon..7=Sun
function weekStart(s){ const offset = (isoWeekday(s)-1); return addDaysStr(s, -offset); }  // 返回周一日期
function formatNum(x){ if(x===null||x===undefined||isNaN(x))return '0'; return Number.isInteger(x)?String(x):(Math.round(x*10)/10).toString(); }
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
const ALL_WEEKDAYS = [1,2,3,4,5,6,7];
const WORK_WEEKDAYS = [1,2,3,4,5];
const WEEKDAY_NAMES = ['一','二','三','四','五','六','日'];

function normalizeGoalSchedule(goal){
  const type = ['daily','weekdays','custom'].includes(goal.scheduleType) ? goal.scheduleType : 'daily';
  let days = type === 'daily' ? ALL_WEEKDAYS : type === 'weekdays' ? WORK_WEEKDAYS : goal.repeatDays;
  days = Array.isArray(days)
    ? [...new Set(days.map(Number).filter(d=>d>=1 && d<=7))].sort((a,b)=>a-b)
    : [];
  if(days.length === 0){ days = [...ALL_WEEKDAYS]; }
  return {...goal, scheduleType:type, repeatDays:days};
}
function goalScheduleDays(goal){ return normalizeGoalSchedule(goal).repeatDays; }
function isGoalScheduledOn(goal, date){
  if(!goal || !date) return false;
  if(goal.createdAt && diffDays(date, goal.createdAt.slice(0,10)) < 0) return false;
  return goalScheduleDays(goal).includes(isoWeekday(date));
}
function goalScheduleLabel(goal){
  const normalized = normalizeGoalSchedule(goal);
  if(normalized.scheduleType === 'daily') return '每天';
  if(normalized.scheduleType === 'weekdays') return '工作日';
  return normalized.repeatDays.map(d=>`周${WEEKDAY_NAMES[d-1]}`).join('、');
}
function countScheduledDays(goal, start, end){
  if(diffDays(end, start) < 0) return 0;
  let count = 0;
  let cur = start;
  let safety = 4000;
  while(diffDays(end, cur) >= 0 && safety-- > 0){
    if(isGoalScheduledOn(goal, cur)) count++;
    cur = addDaysStr(cur, 1);
  }
  return count;
}

function loadAll(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(Array.isArray(data.goals)) state.goals = data.goals.map(normalizeGoalSchedule);
    if(Array.isArray(data.records)) state.records = data.records;
    if(data.reports && typeof data.reports==='object') state.reports = data.reports;
    if(typeof data.backupReminderDismissed === 'boolean') state.backupReminderDismissed = data.backupReminderDismissed;
    if(typeof data.pomoWorkMinutes === 'number') state.pomodoro.workMinutes = data.pomoWorkMinutes;

/* ========== Toast / Modal 工具 ========== */
function toast(msg, kind='info'){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind==='success'||kind==='error'?kind:'');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.2s'; }, 1800);
  setTimeout(()=>el.remove(), 2200);
}
function modal({title, bodyHTML, footer, onMount, width}){
  const root = document.getElementById('modalRoot');
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  let bodyNode;
  mask.innerHTML = `<div class="modal" ${width?('style="max-width:'+width+'"'):''}>
    <div class="modal-head">
      <h3>${title}</h3>
      <button class="icon-btn" data-close aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">${bodyHTML}</div>
    ${footer?`<div class="modal-foot">${footer}</div>`:''}
  </div>`;
  mask.addEventListener('click',(e)=>{ if(e.target===mask || e.target.closest('[data-close]')) close(); });
  function close(){ mask.remove(); }
  mask._close = close;
  root.appendChild(mask);
  bodyNode = mask.querySelector('.modal-body');
  if(onMount) onMount(bodyNode, close);
  return {el:mask, close, body:bodyNode};
}
function confirmModal({title, message, confirmText='确认', cancelText='取消', danger=false, onConfirm}){
  modal({

    bodyHTML: `<p style="line-height:1.7;color:#374151">${message}</p>`,

      body.parentElement.querySelector('[data-cancel]').onclick = close;
      body.parentElement.querySelector('[data-ok]').onclick = ()=>{ close(); onConfirm && onConfirm(); };

/* ========== 目标派生数据 ========== */
function goalRecords(gid){ return state.records.filter(r=>r.goalId===gid).sort((a,b)=>a.date.localeCompare(b.date)); }
function goalDoneAmount(gid){ return goalRecords(gid).reduce((s,r)=>s+(Number(r.amount)||0),0); }
function goalDoneOn(gid, date){ // 指定日期的累计完成量（isMakeup按真实日期算）
  return goalRecords(gid).filter(r=>r.date===date).reduce((s,r)=>s+(Number(r.amount)||0),0);
}

/* ========== 核心算法 ========== */

/**
 * 计算目标在计划执行日的连续打卡次数
 * 规则：计划外日期不参与统计；当天尚未打卡不算漏打；每周允许 1 次计划内漏打豁免。
 */
function computeStreak(goalId){
  const goal = state.goals.find(g=>g.id===goalId);
  if(!goal) return {streak:0, restUsed:null};
  const created = goal.createdAt.slice(0,10);
  let cur = todayStr();
  const weekRestUsed = {}; // key: weekStartStr -> 0/1
  let streak = 0;
  let lastBreakReason = null;
  let safety = 4000;
  while(safety-- > 0){
    if(diffDays(cur, created) < 0) break; // 目标创建前不统计
    if(!isGoalScheduledOn(goal, cur)){
      cur = addDaysStr(cur, -1);
      continue;
    }
    const done = goalDoneOn(goalId, cur) > 0;
    if(cur === todayStr() && !done){
      cur = addDaysStr(cur, -1);
      continue;
    }
    if(done){
      streak++;
    }else{
      const ws = weekStart(cur);
      const used = weekRestUsed[ws] || 0;
      if(used === 0){
        weekRestUsed[ws] = 1;
      }else{
        lastBreakReason = 'double_miss_in_week';
        break;
      }
    }
    cur = addDaysStr(cur, -1);
  }
  return {streak, lastBreakReason};
}

/**
 * 推算完成日期
 * 基于近 7 天平均速度；样本不足（目标建立不足7天或7天内完成量=0）返回 null
 */
function computeEta(goalId){
  const goal = state.goals.find(g=>g.id===goalId);
  if(!goal) return null;
  const created = goal.createdAt.slice(0,10);
  const today = todayStr();
  const ageDays = diffDays(today, created) + 1;
  if(ageDays < 7) return {state:'too_young', message:'暂无推算'};
  const s7 = addDaysStr(today, -6);
  let s7Sum = 0; let s7DaysWithRecord = 0;
  for(let i=0;i<7;i++){
    const d = addDaysStr(s7, i);
    const v = goalDoneOn(goalId, d);
    if(v > 0){ s7Sum += v; s7DaysWithRecord++; }
  }
  if(s7DaysWithRecord < 3) return {state:'sparse', message:'暂无推算'};
  const avg = s7Sum / 7;
  const done = goalDoneAmount(goalId);
  const remain = Math.max(0, goal.total - done);
  if(avg <= 0) return {state:'stopped', message:'暂无推算'};
  const needed = Math.ceil(remain / avg);
  const etaDate = addDaysStr(today, needed);
  let compare = null;
  if(goal.deadline){
    const d = diffDays(etaDate, goal.deadline);
    if(d < 0) compare = {kind:'ahead', days: -d, text:`提前 ${-d} 天`};
    else if(d > 0) compare = {kind:'behind', days: d, text:`拖后 ${d} 天`};
    else compare = {kind:'ontime', days:0, text:'按时完成'};
  }
  return {state:'ok', etaDate, avg, needed, compare, remain};
}

/**
 * 今日建议完成量 = 剩余量 / 剩余计划执行日数
 * - 未设截止日：用总量 / 30 作为兜底建议（至少 1）
 * - 已逾期：剩余量 / 1 = 剩余量（但总量可能很小，至少 1）
 * - 已完成目标：0
 */
function suggestToday(goalId){
  const g = state.goals.find(x=>x.id===goalId);
  if(!g) return 1;
  const done = goalDoneAmount(goalId);
  const remain = Math.max(0, g.total - done);
  if(remain <= 0) return 0;
  const today = todayStr();
  if(g.deadline){
    const scheduledDays = Math.max(1, countScheduledDays(g, today, g.deadline));
    return Math.max(1, Math.ceil(remain / scheduledDays));
  }
  return Math.max(1, Math.ceil(remain / 30));
}

/* 今日目标分类：只显示今天计划执行的目标；计划内漏打置顶；已完成目标放最后 */
function buildTodayGoals(){
  const today = todayStr();
  const yesterday = addDaysStr(today, -1);
  const list = [];
  for(const g of state.goals){
    const done = goalDoneAmount(g.id);
    const completed = done >= g.total;
    if(!isGoalScheduledOn(g, today)) continue;
    const overdue = !!g.deadline && diffDays(today, g.deadline) > 0 && !completed;
    const yesterdayDone = goalDoneOn(g.id, yesterday) > 0;
    const createdBeforeOrOnYesterday = diffDays(yesterday, g.createdAt.slice(0,10)) >= 0;
    const missYesterday = createdBeforeOrOnYesterday && isGoalScheduledOn(g, yesterday) && !yesterdayDone && !completed;
    const ws = weekStart(today);
    // 卡型：overdue-card / miss-card（第二次计划内漏打）/ rest-card（第一次漏打豁免）/ 普通
    let type = 'normal';
    if(overdue) type = 'overdue';
    else if(!completed){
      // 只统计今天之前、本周计划执行日的漏打；今天尚未完成不算漏打
      let missCount = 0;
      for(let i=0;i<7;i++){
        const d = addDaysStr(ws, i);
        if(diffDays(d, today)>=0) break;
        if(!isGoalScheduledOn(g, d)) continue;
        const recs = state.records.filter(r=>r.goalId===g.id && r.date===d);
        const hasRealRecord = recs.some(r=>Number(r.amount)>0);
        if(!hasRealRecord){ missCount++; }
      }
      if(missCount >= 2) type = 'miss';
      else if(missCount === 1) type = 'rest';
    }
    list.push({
      goal:g, doneAmount:done, completed, overdue, missYesterday,
      type,
    });
  }
  list.sort((a,b)=>{
    // 1. 已完成最后
    if(a.completed !== b.completed) return a.completed?1:-1;
    // 2. missYesterday 置顶
    if(a.missYesterday !== b.missYesterday) return a.missYesterday?-1:1;
    // 3. 按逾期/漏打/正常排
    const score = t => t==='overdue'?0: t==='miss'?1: t==='rest'?2:3;
    if(score(a.type)!==score(b.type)) return score(a.type)-score(b.type);
    // 4. 按截止日近优先
    const ad = a.goal.deadline ? a.goal.deadline : '9999-12-31';
    const bd = b.goal.deadline ? b.goal.deadline : '9999-12-31';
    return ad.localeCompare(bd);
  });
  return list;
}

      body.querySelectorAll('input[name="scheduleType"]').forEach(el=>el.addEventListener('change', syncScheduleUI));
      syncScheduleUI();
      body.parentElement.querySelector('[data-save]').onclick = ()=>{
        const name = document.getElementById('f-name').value.trim();
        const unit = document.getElementById('f-unit').value.trim();
        const total = Math.floor(Number(document.getElementById('f-total').value));
        const deadline = document.getElementById('f-deadline').value || '';

        const customRepeatDays = [...body.querySelectorAll('input[name="repeatDay"]:checked')].map(el=>Number(el.value));
        const repeatDays = scheduleType === 'daily'
          ? [...ALL_WEEKDAYS]
          : scheduleType === 'weekdays' ? [...WORK_WEEKDAYS] : customRepeatDays;
        const color = (body.querySelector('input[name="goalcolor"]:checked') || {}).value || COLOR_PALETTE[0].bg;
        const obstacle = document.getElementById('f-obstacle').value.trim();
        const strategy = document.getElementById('f-strategy').value.trim();

        if(!unit){ toast('请填写计量单位','error'); return; }
        if(!(total>0)){ toast('总量必须是正整数','error'); return; }
        if(scheduleType === 'custom' && repeatDays.length === 0){ toast('请至少选择一个执行日','error'); return; }
        if(deadline){
          if(diffDays(deadline, todayStr())<0){ toast('截止日期不能在过去','error'); return; }
        }
        if(isEdit){
          Object.assign(editGoal, {name, unit, total, deadline, scheduleType, repeatDays, color, obstacle, strategy});
          toast('已保存修改', 'success');
        }else{
          state.goals.push({
            id:uid(), name, unit, total, deadline, scheduleType, repeatDays,
            color, obstacle, strategy, createdAt: new Date().toISOString()
          });
          toast('目标已创建', 'success');
        }
        saveAll(); close(); render();
      };
    }
  });
}

/* ========== 打卡模态（可用于即时打卡 + 补记）============ */
function openCheckinModal(goalId, opts={}){
  const g = state.goals.find(x=>x.id===goalId); if(!g) return;
  const suggest = suggestToday(goalId);
  // 可补记的最近 6 天（today-6 ~ today-1） + 今日
  const today = todayStr();
  const dateChoices = [{v:today, t:'今日 '+today}];
  for(let i=1;i<=6;i++){
    const d = addDaysStr(today, -i);
    dateChoices.push({v:d, t:`补记 ${d}（${['周一','周二','周三','周四','周五','周六','周日'][isoWeekday(d)-1]}）`});
  }
  const defaultDate = opts.forDate || today;
  const done = goalDoneAmount(goalId);
  const remain = Math.max(0, g.total - done);
  const isMakeup = defaultDate !== today;
  const m = modal({
    title: `${isMakeup?'补记打卡':'打卡'}：${g.name}`,
    width: '500px',
    bodyHTML: `
      <div class="field">
        <label>日期</label>
        <select id="c-date">
          ${dateChoices.map(dc=>`<option value="${dc.v}" ${dc.v===defaultDate?'selected':''}>${dc.t}</option>`).join('')}
        </select>
        <span class="hint">支持补记最近 6 天的打卡记录</span>
      </div>
      <div class="field">
        <label>本次完成数量（单位：${g.unit}）</label>
        <div class="amount-input" style="width:100%">
          <input type="number" id="c-amount" min="1" max="${remain||''}" value="${isMakeup?1:suggest}">
          <div class="unit">${g.unit}</div>
        </div>
        <span class="hint">系统建议今日完成 ${suggest} ${g.unit}（剩余 ${remain}${g.unit} ÷ 剩余天数）。可自由修改。</span>
      </div>
      <div class="field">
        <label>投入分钟数（选填）</label>
        <div class="minute-chip"><input type="number" id="c-min" min="0" placeholder="0"> <span>分钟</span></div>
      </div>
      <div class="field">
        <label>备注（选填）</label>
        <textarea id="c-note" placeholder="今天学了什么、有什么心得..."></textarea>
      </div>
    `,
    footer: `
      <button class="btn btn-outline" data-cancel>取消</button>
      <button class="btn btn-primary" data-save>${isMakeup?'确认补记':'确认打卡'}</button>
    `,
    onMount(body, close){
      body.parentElement.querySelector('[data-cancel]').onclick = close;
      body.parentElement.querySelector('[data-save]').onclick = ()=>{
        const date = document.getElementById('c-date').value;
        const amount = Math.max(0, Math.floor(Number(document.getElementById('c-amount').value)||0));
        const minutes = Math.max(0, Math.floor(Number(document.getElementById('c-min').value)||0));
        const note = document.getElementById('c-note').value.trim();
        if(!(amount>0)){ toast('完成数量必须大于 0','error'); return; }
        if(amount > remain && date === today){
          // 超过剩余：允许，但给出提醒（目标会显示超额完成）
        }
        state.records.push({
          id: uid(), goalId, date, amount, minutes,
          isMakeup: date !== today,
          isRestDay: false, note,
        });
        saveAll();
        toast(date===today?'打卡成功 🎉':'补记成功','success');
        close();
        // 达成检测
        const newDone = goalDoneAmount(goalId);
        if(newDone >= g.total){
          const wasDone = done >= g.total;
          if(!wasDone) launchConfetti();
        }
        render();
      };
    }
  });
}

/* 彩带 */
function launchConfetti(){
  const root = document.getElementById('confettiRoot');
  const colors = ['#7C3AED','#A855F7','#2563EB','#10B981','#F59E0B','#EF4444','#0891B2'];
  for(let i=0;i<80;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random()*100 + '%';
    el.style.background = colors[i%colors.length];
    el.style.animationDelay = (Math.random()*0.6).toFixed(2)+'s';
    el.style.animationDuration = (2.2 + Math.random()*1.6).toFixed(2)+'s';
    root.appendChild(el);
    setTimeout(()=>el.remove(), 4200);
  }
}

/* ========== 今日 Tab 渲染 ========== */
function renderToday(){
  const box = document.getElementById('tab-today');
  const today = todayStr();
  const items = buildTodayGoals();

  let inner = `
    <button class="hero-create" onclick="openGoalModal()">
      ${svgi('PLUS')} 新建学习目标
    </button>
    <div class="pomo-setup">
      <label>🍅 番茄钟时长</label>
      <input type="number" min="1" max="180" value="${state.pomodoro.workMinutes}" onchange="setPomoWorkMinutes(this.value)">
      <span class="hint">分钟（默认 25）</span>
      <span class="hint" style="margin-left:auto">专注完成后自动记录到目标</span>
    </div>
    <div class="page-header">
      <div class="page-title">今日待办</div>
      <div class="hint">${today}</div>
    </div>`;

  if(items.length === 0){
    const hasGoals = state.goals.length > 0;
    inner += `<div class="empty">
      ${svgi(hasGoals?'TODAY':'GOAL')}
      <h4>${hasGoals?'今天没有安排目标':'还没有学习目标'}</h4>
      <p>${hasGoals?'按执行周期休息一天，或去看板查看全部目标':'点击上方「新建学习目标」，开启你的成长旅程'}</p>
    </div>`;
  }

  for(const item of items){
    const g = item.goal;
    const done = item.doneAmount;
    const remain = Math.max(0, g.total - done);
    const pct = clamp(done / g.total * 100, 0, 100);
    const suggest = item.completed ? 0 : suggestToday(g.id);
    const streak = computeStreak(g.id).streak;
    const eta = computeEta(g.id);
    const overdue = item.overdue;
    const overdueDays = overdue ? diffDays(today, g.deadline) : 0;

    // 状态徽章
    let badges = [];
    if(item.completed) badges.push(`<span class="badge badge-success">${svgi('CHECK')}已达成</span>`);
    if(overdue) badges.push(`<span class="badge badge-danger">${svgi('WARN')}逾期 ${overdueDays} 天</span>`);
    if(item.missYesterday && !overdue && !item.completed) badges.push(`<span class="badge badge-danger">昨日未打卡（已计入本周漏打）</span>`);
    if(item.type==='rest' && !item.missYesterday && !overdue && !item.completed) badges.push(`<span class="badge badge-warn">黄卡 · 本周 1 次漏打已豁免</span>`);
    if(item.type==='miss' && !overdue && !item.completed) badges.push(`<span class="badge badge-danger">红卡 · 本周第二次漏打，将中断连续</span>`);
    badges.push(`<span class="badge badge-idle">${goalScheduleLabel(g)}</span>`);

    // 推算状态
    let etaLine = '';
    if(eta && eta.state === 'ok'){
      const cmpCls = eta.compare ? (eta.compare.kind==='ahead'?'badge-success' : eta.compare.kind==='behind'?'badge-danger' : 'badge-idle') : 'badge-idle';
      const cmpTxt = eta.compare ? eta.compare.text : '';
      etaLine = `<span class="badge ${cmpCls}">预计 ${eta.etaDate.slice(5)} 完成 · ${cmpTxt}</span>`;
    }else if(eta){
      etaLine = `<span class="badge badge-idle">${eta.message}</span>`;
    }

    // 目标卡片类型
    const cls = ['goal-card card'];
    if(item.type==='overdue') cls.push('overdue-card');
    if(item.type==='miss') cls.push('miss-card');
    if(item.type==='rest') cls.push('rest-card');
    if(item.missYesterday && !overdue) cls.push('yesterday-miss');

    inner += `
      <div class="${cls.join(' ')}" style="--card-color:${g.color}">
        <div class="card-header">
          <div style="min-width:0;flex:1">
            <div class="card-title">
              <span class="card-dot" style="background:${g.color}"></span>
              <span class="goal-name" style="color:var(--text)">${g.name}</span>
            </div>
            <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:6px">${badges.join('')}${etaLine}</div>
            <div class="card-sub" style="margin-top:6px">连续 ${streak} 次 · 截止 ${g.deadline||'不限'}</div>
          </div>
          <div class="action-icons">
            <button class="icon-btn" onclick="openGoalModal(state.goals.find(x=>x.id==='${g.id}'))" title="编辑">${svgi('EDIT')}</button>
            <button class="icon-btn danger" onclick="removeGoal('${g.id}')" title="删除">${svgi('TRASH')}</button>
          </div>
        </div>

        <div class="goal-progress"><div style="width:${pct}%;background:linear-gradient(90deg,${g.color},${g.color}AA)"></div></div>
        <div class="goal-meta">
          <span>总量 ${g.total}${g.unit}</span>
          <span>已完成 ${done}${g.unit} (${(pct).toFixed(0)}%)</span>
          <span>剩余 ${remain}${g.unit}</span>
        </div>

        ${(g.obstacle || g.strategy) ? `
          <div class="plan-box">
            ${g.obstacle?`<div><strong>⚠️ 障碍：</strong>${g.obstacle}</div>`:''}
            ${g.strategy?`<div><strong>✅ 对策：</strong>${g.strategy}</div>`:''}
          </div>`:''}

        <div class="quick-row">
          ${!item.completed ? `
            <div class="amount-input">
              <input type="number" id="q-${g.id}" min="1" value="${suggest}">
              <div class="unit">${g.unit}</div>
            </div>
            <div class="minute-chip" title="投入分钟数（选填）">
              ${svgi('CLOCK')} <input type="number" id="qm-${g.id}" min="0" placeholder="0"> 分钟
            </div>
            <button class="btn btn-primary" onclick="quickCheckin('${g.id}')">今日打卡</button>
            <button class="btn btn-outline" onclick="startPomodoro('${g.id}')" title="用番茄钟专注此目标">🍅 专注</button>
            <button class="btn btn-outline" onclick="openCheckinModal('${g.id}',{history:true})">补记</button>
          ` : `
            <button class="btn btn-success" disabled>🎉 已达成</button>
            <button class="btn btn-outline" onclick="openCheckinModal('${g.id}')">追加记录</button>
          `}
        </div>

        ${overdue ? `
          <div class="overdue-footer">
            <span>⚠️ 目标已逾期 ${overdueDays} 天，建议立即打卡或调整计划</span>
            <span>
              <button class="btn btn-primary" style="padding:6px 10px;font-size:12px" onclick="openCheckinModal('${g.id}')">立即打卡</button>
              <button class="btn btn-outline" style="padding:6px 10px;font-size:12px" onclick="adjustGoal('${g.id}')">调整计划</button>
            </span>
          </div>
        `:''}
      </div>
    `;
  }

  inner += `
    <div class="bottom-create">
      <p>🎯 想开始新的挑战？设置一个明确的终点和总量，更容易坚持！</p>
      <button class="btn btn-primary" onclick="openGoalModal()">${svgi('PLUS')} 新建目标</button>
    </div>
  `;

  box.innerHTML = inner;
}

/* 快速打卡（今日卡片内） */
function quickCheckin(gid){
  const amtEl = document.getElementById('q-'+gid);
  const minEl = document.getElementById('qm-'+gid);
  const amount = Math.max(0, Math.floor(Number(amtEl && amtEl.value) || 0));
  const minutes = Math.max(0, Math.floor(Number(minEl && minEl.value) || 0));
  if(!(amount>0)){ toast('完成数量必须大于 0','error'); return; }
  const g = state.goals.find(x=>x.id===gid);
  const done = goalDoneAmount(gid);
  state.records.push({
    id:uid(), goalId:gid, date:todayStr(), amount, minutes, isMakeup:false, isRestDay:false, note:'',
  });
  saveAll(); toast('打卡成功 🎉','success');
  const newDone = goalDoneAmount(gid);
  if(newDone >= g.total && done < g.total) launchConfetti();
  render();
}

/* ========== 番茄钟核心 ========== */
function startPomodoro(goalId){
  const g = state.goals.find(x=>x.id===goalId);
  if(!g){ toast('目标不存在','error'); return; }
  const p = state.pomodoro;
  p.phase = 'working';
  p.total = p.workMinutes * 60;
  p.remaining = p.total;
  p.currentGoalId = goalId;
  p.goalTitle = g.name;
  saveAll();
  startPomoTick();
  renderPomodoroBar();
  toast(`🍅 番茄钟启动：专注「${g.name}」${p.workMinutes} 分钟`,'success');
}
function startBreak(){
  const p = state.pomodoro;
  p.phase = 'break';
  p.total = p.breakMinutes * 60;
  p.remaining = p.total;
  p.currentGoalId = null;
  p.goalTitle = '休息';
  startPomoTick();
  renderPomodoroBar();
}
function pausePomodoro(){
  const p = state.pomodoro;
  if(p.phase === 'working' || p.phase === 'break'){
    p.phase = 'paused';
    if(pomoTimer){ clearInterval(pomoTimer); pomoTimer = null; }
    renderPomodoroBar();
  }else if(p.phase === 'paused'){
    // 恢复
    p.phase = p.remaining > 0 && p.currentGoalId ? 'working' : 'break';
    startPomoTick();
    renderPomodoroBar();
  }
}
function stopPomodoro(){
  const p = state.pomodoro;
  p.phase = 'idle';
  p.remaining = 0;
  p.total = 0;
  p.currentGoalId = null;
  p.goalTitle = '';
  if(pomoTimer){ clearInterval(pomoTimer); pomoTimer = null; }
  renderPomodoroBar();
}
function startPomoTick(){
  if(pomoTimer){ clearInterval(pomoTimer); }
  pomoTimer = setInterval(()=>{
    const p = state.pomodoro;
    p.remaining--;
    if(p.remaining <= 0){
      // 番茄钟完成
      clearInterval(pomoTimer); pomoTimer = null;
      onPomodoroComplete();
    }
    renderPomodoroBar();
  }, 1000);
}
function onPomodoroComplete(){
  const p = state.pomodoro;
  const wasWork = p.phase === 'working';
  const workMin = p.total > 0 ? Math.round(p.total / 60) : p.workMinutes;

  if(wasWork && p.currentGoalId){
    // 自动打卡：记录专注时长到当前目标，打卡量=1（表示完成一次专注session）
    const gid = p.currentGoalId;
    const g = state.goals.find(x=>x.id===gid);
    const done = goalDoneAmount(gid);
    state.records.push({
      id:uid(), goalId:gid, date:todayStr(),
      amount:1, minutes:workMin,
      isMakeup:false, isRestDay:false,
      note:`🍅 番茄钟专注 ${workMin} 分钟`,
    });
    saveAll();
    toast(`🍅 专注完成！已记录 ${workMin} 分钟到「${p.goalTitle}」`,'success');
    const newDone = goalDoneAmount(gid);
    if(g && newDone >= g.total && done < g.total) launchConfetti();
    render();
    // 询问是否休息
    setTimeout(()=>{
      if(confirm('专注完成！是否开始休息？')){
        startBreak();
      }else{
        stopPomodoro();
      }
    }, 200);
  }else if(wasWork){
    toast(`🍅 专注完成（${workMin} 分钟）`,'success');
    stopPomodoro();
  }else{
    // 休息完成
    toast('☕ 休息结束，可以开始下一轮了','success');
    stopPomodoro();
  }
}
function setPomoWorkMinutes(v){
  v = clamp(Math.floor(Number(v)||25), 1, 180);
  state.pomodoro.workMinutes = v;
  saveAll();
  // 如果空闲，更新浮动条显示
  if(state.pomodoro.phase === 'idle'){
    renderPomodoroBar();
  }
}
function pomoFormatTime(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return pad(m)+':'+pad(sec);
}
function pomoPhaseLabel(){
  const p = state.pomodoro;
  if(p.phase==='working') return '专注中';
  if(p.phase==='break') return '休息中';
  if(p.phase==='paused') return '已暂停';
  return '空闲';
}
function pomoPhaseColor(){
  const p = state.pomodoro;
  if(p.phase==='working') return '#F97316';
  if(p.phase==='break') return '#10B981';
  if(p.phase==='paused') return '#6B7280';
  return '#7C3AED';
}

/* ========== 番茄钟浮动条渲染 ========== */
function renderPomodoroBar(){
  const bar = document.getElementById('pomoBar');
  if(!bar) return;
  const p = state.pomodoro;
  if(p.phase === 'idle'){
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  const color = pomoPhaseColor();
  const label = pomoPhaseLabel();
  const time = pomoFormatTime(p.remaining);
  const progress = p.total > 0 ? clamp((1 - p.remaining/p.total)*100, 0, 100) : 0;
  const pauseBtnText = p.phase === 'paused' ? '继续' : '暂停';
  const goalPart = p.currentGoalId ? ` · ${p.goalTitle}` : '';
  bar.innerHTML = `
    <div class="pomo-info" style="color:${color}">
      <span class="pomo-phase">${label}${goalPart}</span>
      <span class="pomo-time" style="background:${color}">${time}</span>
    </div>
    <div class="pomo-progress"><div style="width:${progress}%;background:${color}"></div></div>
    <div class="pomo-actions">
      <button class="btn btn-outline" style="padding:5px 12px;font-size:12px" onclick="pausePomodoro()">${pauseBtnText}</button>
      <button class="btn btn-danger" style="padding:5px 12px;font-size:12px" onclick="stopPomodoro()">停止</button>
    </div>
  `;
}


/* ========== 进度环 SVG（80px） ========== */
function ringSVG(color, pct, text){
  pct = clamp(pct, 0, 100);
  const R = 36; const C = 2 * Math.PI * R;
  const off = C * (1 - pct/100);
  return `<div class="ring">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle class="ring-bg" cx="40" cy="40" r="${R}"/>
      <circle class="ring-fg" cx="40" cy="40" r="${R}" stroke="${color}"
              stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>
    </svg>
    <div class="ring-text" style="color:${color}">${text}</div>
  </div>`;
}

/* 近14天 投入分钟数 分目标堆叠柱状图 */
function renderMinutesChartHTML(){
  const today = todayStr();
  const days = []; // [{date, [perGoalMin]}]
  for(let i=13;i>=0;i--){
    const d = addDaysStr(today, -i);
    const perGoal = {};
    let total = 0;
    for(const g of state.goals){
      const recs = state.records.filter(r=>r.goalId===g.id && r.date===d);
      const m = recs.reduce((s,r)=>s + (Number(r.minutes)||0), 0);
      if(m>0){ perGoal[g.id] = m; total += m; }
    }
    days.push({date:d, perGoal, total, iso:isoWeekday(d)});
  }
  const maxMin = Math.max(1, ...days.map(d=>d.total));
  const barH = 100;     // 柱最大高度
  const n = days.length;
  const w = 100, gap = 1.2;  // 百分比坐标
  const bw = (w - gap*(n+1)) / n;

  let rects = '';
  for(let i=0;i<n;i++){
    const day = days[i];
    const x = gap + i*(bw + gap);
    let yAccum = 0;
    // 按目标id排序确保稳定堆叠
    const entries = Object.entries(day.perGoal).sort((a,b)=>a[0].localeCompare(b[0]));
    for(const [gid, min] of entries){
      const g = state.goals.find(x=>x.id===gid); if(!g) continue;
      const h = (min / maxMin) * barH;
      const y = barH - yAccum - h;
      yAccum += h;
      rects += `<rect x="${x.toFixed(2)}%" y="${y.toFixed(2)}" width="${bw.toFixed(2)}%" height="${h.toFixed(2)}" fill="${g.color}" rx="2">
        <title>${day.date} ${g.name} ${min} 分钟</title></rect>`;
    }
  }
  // x 轴标签：用 HTML flex 布局，避免 SVG preserveAspectRatio 拉伸导致文字变形挤压
  let labelsHtml = '';
  for(let i=0;i<n;i++){
    const day = days[i];
    const mmdd = day.date.slice(5);
    const weekend = day.iso===6 || day.iso===7;
    labelsHtml += `<div style="flex:1;text-align:center;font-size:11px;color:${weekend?'#EF4444':'#9CA3AF'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${mmdd}</div>`;
  }
  // 图例
  let legend = '';
  for(const g of state.goals){
    legend += `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;color:var(--text-sec)">
      <span style="width:10px;height:10px;background:${g.color};border-radius:2px"></span>${g.name}</span>`;
  }

  const goalsHaveMinutes = state.goals.some(g => state.records.some(r=>r.goalId===g.id && r.minutes>0));
  if(!goalsHaveMinutes){
    return `<div class="card">
      <div class="chart-title">📊 近 14 天投入分钟数（堆叠柱状图）</div>
      <div style="padding:18px;color:var(--text-sec);font-size:13px;text-align:center">暂无投入分钟数数据<br><span style="font-size:12px">打卡时填写"投入分钟数"，图表将按目标色彩堆叠展示</span></div>
    </div>`;
  }

  return `<div class="card">
    <div class="chart-title">📊 近 14 天投入分钟数（按目标颜色堆叠）</div>
    <div style="margin-bottom:8px;overflow-x:auto">${legend}</div>
    <div class="chart-wrap">
      <svg viewBox="0 0 100 ${barH}" preserveAspectRatio="none" style="width:100%;height:120px;display:block">
        <!-- 背景网格 -->
        <line x1="0" y1="${barH}" x2="100%" y2="${barH}" stroke="#E5E7EB" stroke-width="0.3"/>
        <line x1="0" y1="${barH*0.5}" x2="100%" y2="${barH*0.5}" stroke="#F3F4F6" stroke-width="0.2"/>
        ${rects}
      </svg>
      <div style="display:flex;gap:2px;margin-top:6px">${labelsHtml}</div>
    </div>
  </div>`;
}

function renderWeekly(){
  const box = document.getElementById('tab-weekly');
  const today = todayStr();
  if(!state.currentWeekStart) state.currentWeekStart = weekStart(today);
  const ws = state.currentWeekStart;
  const prev = addDaysStr(ws, -7);
  const next = addDaysStr(ws, 7);
  const nextDisabled = diffDays(next, weekStart(today)) > 0;  // 不能看未来整周

  // 当前周7天
  const curRange = Array.from({length:7},(_,i)=>addDaysStr(ws, i));
  const prevRange = Array.from({length:7},(_,i)=>addDaysStr(prev, i));

  // 每目标统计：{ [gid]: {amount, days, minutes} }
  const sumFor = (range)=>{
    const byGoal = {}; let totalDays = new Set(); let totalMin = 0;
    for(const g of state.goals) byGoal[g.id] = {amount:0, days:0, minutes:0, goal:g};
    for(const r of state.records){
      if(!byGoal[r.goalId]) continue;
      if(!range.includes(r.date)) continue;
      byGoal[r.goalId].amount += Number(r.amount)||0;
      byGoal[r.goalId].minutes += Number(r.minutes)||0;
      byGoal[r.goalId].daysSet = byGoal[r.goalId].daysSet || new Set();
      byGoal[r.goalId].daysSet.add(r.date);
      totalDays.add(r.date);
      totalMin += Number(r.minutes)||0;
    }
    for(const gid in byGoal) byGoal[gid].days = byGoal[gid].daysSet ? byGoal[gid].daysSet.size : 0;
    return { byGoal, totalDays: totalDays.size, totalMin };

    </div>

    <div class="compare-summary">
      ${card('打卡天数', cur.totalDays, last.totalDays)}
      ${card('投入分钟数', cur.totalMin, last.totalMin)}
      ${card('目标数', state.goals.length, state.goals.length)}
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:8px">📋 各目标本周投入（上周同口径括号内）</div>

        <table class="goal-week-table">
          <thead><tr><th>目标</th><th>完成量</th><th>打卡天数</th><th>投入分钟</th></tr></thead>

    <div class="notes-grid">
      <div>

  lines.push(`# 学习周报 ${ws} ~ ${addDaysStr(ws,6)}`);
  lines.push('');
  lines.push(`## 一、总览`);
  lines.push(`- 打卡天数：**${cur.totalDays} 天**（上周 ${last.totalDays}，${ringDelta(cur.totalDays, last.totalDays)}）`);
  lines.push(`- 投入分钟：**${cur.totalMin} 分钟**（上周 ${last.totalMin}，${ringDelta(cur.totalMin, last.totalMin)}）`);
  lines.push(`- 学习目标：共 **${state.goals.length}** 个`);
  lines.push('');
  lines.push(`## 二、分目标进展`);
  const hasGoals = state.goals.length > 0;
  if(!hasGoals){
    lines.push('- 暂无目标');
  }else{
    for(const g of state.goals){
      const c = cur.byGoal[g.id]; const p = last.byGoal[g.id];
      const done = goalDoneAmount(g.id);
      const pct = (done/g.total*100).toFixed(0);
      lines.push(`### ${g.name}（${g.total}${g.unit}，已完成 ${done}${g.unit}，${pct}%）`);
      lines.push(`- 本周完成量：${c.amount}${g.unit}（上周 ${p.amount}，${ringDelta(c.amount, p.amount)}${g.unit}）`);
      lines.push(`- 打卡天数：${c.days} 天（上周 ${p.days}）`);
      lines.push(`- 投入时间：${c.minutes} 分钟（上周 ${p.minutes}）`);
      lines.push('');
    }
  }
  lines.push(`## 三、四栏复盘`);
  lines.push(`**✅ 保持事项**：${rep.keep || '（未填写）'}`);
  lines.push('');
  lines.push(`**⚠️ 问题记录**：${rep.problem || '（未填写）'}`);
  lines.push('');
  lines.push(`**🧪 尝试方案**：${rep.try || '（未填写）'}`);
  lines.push('');
  lines.push(`**🎯 下周预案**：${rep.planNext || '（未填写）'}`);
  lines.push('');
  lines.push('---');
  lines.push('_由学习目标工作台自动生成_');

  const txt = lines.join('\n');
  const out = document.getElementById('reportOutput');
  out.innerHTML = `<div class="card" style="padding:0;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)">
        <span style="font-weight:700;font-size:14px">📄 生成结果（可复制）</span>
        <button class="btn btn-outline" style="padding:5px 10px;font-size:12px" onclick='copyReportText(${JSON.stringify(txt.replace(/'/g,"\\'"))})'>${svgi('COPY')} 复制全文</button>
      </div>
      <div class="report-box">${escapeHTML(txt)}</div>
    </div>`;
}
function copyReportText(t){

  try{ document.execCommand('copy'); toast('周报文本已复制到剪贴板','success'); }catch(e){ toast('复制失败','error'); }

/* ========== 数据管理实现 ========== */
function exportJSON(){
  const blob = new Blob([JSON.stringify({
    version: 2,
    exportedAt: new Date().toISOString(),
    goals: state.goals,
    records: state.records,
    reports: state.reports,
  }, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `learning-dashboard-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  toast('已导出 JSON 文件','success');
  state.backupReminderDismissed = true; saveAll();
  updateBackupBanner();
}

function triggerImport(){ document.getElementById('importFileInput').click(); }
function importJSON(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.goals) || !Array.isArray(data.records)){
        throw new Error('文件格式不正确');
      }
      confirmModal({
        title:'确认导入并覆盖？',
        message:`将用该文件中的 <strong>${data.goals.length} 个目标 + ${data.records.length} 条记录</strong> 覆盖你现有的所有数据。<br><span style="color:var(--danger)">现有数据将不可恢复，建议先导出备份。</span>`,
        confirmText:'确认覆盖导入', danger:true,
        onConfirm(){
          state.goals = data.goals.map(normalizeGoalSchedule);
          state.records = data.records;
          state.reports = (data.reports && typeof data.reports==='object') ? data.reports : {};
          saveAll(); toast('导入成功','success'); render();
        }
      });
    }catch(e){ toast('读取失败：'+e.message,'error'); }
  };
  reader.readAsText(f);
  ev.target.value = '';
}

function migrateOldData(){
  // 兼容老版本 key 或结构
  const CANDIDATES = ['learning_dashboard','learning_tracker_v1','study_tracker','goals_app_v1'];
  let imported = false;
  for(const k of CANDIDATES){
    if(k === LS_KEY) continue;
    const raw = localStorage.getItem(k);
    if(!raw) continue;
    try{
      const d = JSON.parse(raw);
      if(Array.isArray(d.goals)){
        // 合并目标（同名跳过）
        const existNames = new Set(state.goals.map(g=>g.name));
        for(const g of d.goals){
          if(existNames.has(g.name)) continue;
          state.goals.push(normalizeGoalSchedule({
            id: uid(), name:g.name||'未命名', unit:g.unit||'个', total:Math.max(1,Number(g.total)||100),
            deadline:g.deadline||'', color:g.color||COLOR_PALETTE[0].bg,
            obstacle:g.obstacle||'', strategy:g.strategy||'',
            scheduleType:g.scheduleType||'daily', repeatDays:g.repeatDays,
            createdAt: g.createdAt||new Date().toISOString(),
          }));
        }
        // 合并记录
        if(Array.isArray(d.records)){
          for(const r of d.records){
            if(!r.goalId) continue;
            state.records.push({
              id: uid(), goalId:r.goalId, date:r.date||todayStr(),
              amount:Number(r.amount)||0, minutes:Number(r.minutes)||0,
              isMakeup:!!r.isMakeup, isRestDay:!!r.isRestDay, note:r.note||'',
            });
          }
        }
        imported = true;
      }
    }catch(e){ console.warn('migrate error', k, e); }
  }
  if(!imported){ toast('没有发现可迁移的旧数据','info'); return; }
  saveAll(); toast('迁移完成，请检查数据','success'); render();
}

function clearSampleData(){
  const beforeG = state.goals.length, beforeR = state.records.length;
  state.goals = state.goals.filter(g => !g._sample);
  const remainGIds = new Set(state.goals.map(g=>g.id));
  state.records = state.records.filter(r => remainGIds.has(r.goalId) && !r._sample);
  if(beforeG === state.goals.length && beforeR === state.records.length){
    toast('没有找到示例数据','info'); return;
  }
  saveAll();
  toast(`已清理示例：目标 ${beforeG-state.goals.length} 条 / 记录 ${beforeR-state.records.length} 条`,'success');
  render();
}

function confirmWipeAll(){

    title:'删除全部数据',
    bodyHTML: `<p style="line-height:1.7;color:#374151">

      请在下方输入「<strong>清空</strong>」二字进行确认：
    </p>
    <input type="text" id="wipeWord" placeholder="请输入：清空" style="margin-top:8px;width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;outline:none;font-weight:700;letter-spacing:2px">
    `,
    footer: `<button class="btn btn-outline" data-c>取消</button>
             <button class="btn btn-danger" data-ok>删除全部</button>`,
    onMount(body, close){
      body.parentElement.querySelector('[data-c]').onclick = close;
      body.parentElement.querySelector('[data-ok]').onclick = ()=>{

        localStorage.removeItem(LS_KEY);
        saveAll(); close(); toast('已重置为干净状态','success'); initSample(); render();
      };
    }
  });
}

/* ========== 预置示例数据 ========== */
function initSample(){
  if(state.goals.length > 0) return; // 已有数据不覆盖
  const today = todayStr();
  // 3个目标
  const g1 = { id:uid(), name:'背英语单词',       unit:'个', total:2000, deadline:addDaysStr(today, 90), color:COLOR_PALETTE[0].bg,
               scheduleType:'daily', repeatDays:[...ALL_WEEKDAYS],
               obstacle:'早上起不来，背单词容易困', strategy:'把单词卡片放到枕头边，醒了先拿手机 App 背 10 分钟再起床',
               createdAt: new Date(Date.now() - diffDays(today, addDaysStr(today,-20))*86400000).toISOString(),
               _sample:true };
  const g2 = { id:uid(), name:'读《人类简史》',     unit:'页', total:440,  deadline:addDaysStr(today, 45), color:COLOR_PALETTE[2].bg,
               scheduleType:'daily', repeatDays:[...ALL_WEEKDAYS],
               obstacle:'刷手机之后就忘了看书', strategy:'每晚把平板放客厅，床头只放一本书和一个小夜灯',
               createdAt: new Date(Date.now() - diffDays(today, addDaysStr(today,-14))*86400000).toISOString(),
               _sample:true };
  const g3 = { id:uid(), name:'Python入门课',      unit:'节', total:52,   deadline:addDaysStr(today, 120), color:COLOR_PALETTE[1].bg,
               scheduleType:'daily', repeatDays:[...ALL_WEEKDAYS],
               obstacle:'', strategy:'',
               createdAt: new Date(Date.now() - diffDays(today, addDaysStr(today,-8))*86400000).toISOString(),
               _sample:true };
  state.goals.push(g1, g2, g3);

  // 构造记录：多状态（补记、休息日、连续漏打、分钟数）
  // g1：背单词 —— 20天，最近7天每天打卡良好，14-20天前正常
  // 故意构造：昨日漏打卡、前一天前有一次补记、周末（周六）休息一次
  const records = [];
  // 以今天为 d0
  // g1 ：d-2 至 d-8 每天有正常记录；d-1 昨日漏（不加记录）
  for(const dayOffset of [-19,-18,-17,-16,-15,-14,-13,-12,-11,-10,-9,-8,-7,-6,-5,-4,-3,-2]){
    records.push({ id:uid(), goalId:g1.id, date:addDaysStr(today, dayOffset),
      amount: 25+Math.floor(Math.random()*10), minutes:20+Math.floor(Math.random()*15),
      isMakeup:false, isRestDay:false, note:'', _sample:true });
  }
  // d-6 再加一条补记（isMakeup=true），模拟 d-13 原本漏打，在 d-6 补
  records.push({ id:uid(), goalId:g1.id, date:addDaysStr(today,-13),
    amount: 30, minutes: 0, isMakeup:true, isRestDay:false, note:'周三那天忘记打，今天补', _sample:true });
  // d-10 标记为休息日（isRestDay=true）
  records.push({ id:uid(), goalId:g1.id, date:addDaysStr(today,-10),
    amount:0, minutes:0, isMakeup:false, isRestDay:true, note:'周末出游休息', _sample:true });

  // g2 ：读人类简史 —— 建立 14 天，最近 2 天没打（会触发本周第二次漏打=红卡），记录里含分钟数
  for(const dayOffset of [-14,-13,-12,-11,-10,-9,-7,-6,-5,-4]){ // 跳过 -8 和 -3,-2,-1
    records.push({ id:uid(), goalId:g2.id, date:addDaysStr(today, dayOffset),
      amount: 10+Math.floor(Math.random()*15), minutes:30+Math.floor(Math.random()*40),
      isMakeup:false, isRestDay:false, note:'', _sample:true });
  }
  // -3：补记（周日）
  records.push({ id:uid(), goalId:g2.id, date:addDaysStr(today,-3),
    amount: 16, minutes: 50, isMakeup:true, isRestDay:false, note:'昨晚没来得及，今天补上', _sample:true });

  // g3 ：Python入门 —— 建立 8 天，打了前4天，连续漏打 3 天（-6,-5,-4 无记录），然后昨天补上
  for(const dayOffset of [-8,-7,-6,-5]){
    records.push({ id:uid(), goalId:g3.id, date:addDaysStr(today, dayOffset),
      amount: 1, minutes: 45, isMakeup:false, isRestDay:false, note:'', _sample:true });
  }
  records.push({ id:uid(), goalId:g3.id, date:addDaysStr(today,-1),
    amount: 2, minutes: 90, isMakeup:true, isRestDay:false, note:'补记昨天连看两节', _sample:true });

  state.records = records;
  saveAll();
}

function switchTab(k){
  if(!TAB_LIST.find(t=>t.key===k)) return;
  state.activeTab = k;
  document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');
  const el = document.getElementById('tab-'+k);
  if(el) el.style.display = '';
  renderNav(); render();
  window.scrollTo(0,0);
}
